# Base configuration. User overrides go in config/custom.yaml (deep-merged on
# top; template config/local.example.yaml).
# ${VAR} interpolates environment variables; ${VAR:default} provides a fallback.

zotero:
  user_id: ${ZOTERO_ID}
  api_key: ${ZOTERO_KEY}
  include_path: null # Glob patterns of collections to include, e.g. ["2026/survey/**"]
  ignore_path: null # Glob patterns of collections to exclude, e.g. ["archive/**"]

email:
  sender: ${SENDER}
  receiver: ${RECEIVER}
  sender_password: ${SENDER_PASSWORD}
  # smtp_server / smtp_port are resolved from EMAIL_SMTP_SERVER / EMAIL_SMTP_PORT
  # (preferred) or the legacy SMTP_SERVER / SMTP_PORT secrets; they may also be
  # set here directly for local runs.
  subject_prefix: Daily Papers

llm:
  api_key: ${OPENAI_API_KEY}
  base_url: ${OPENAI_API_BASE}
  model: gpt-4o-mini
  max_tokens: 16384
  language: Traditional Chinese # Teaser output language
  requests_per_minute: 10 # Max chat-completion requests per minute; 0 disables throttling
  rate_limit_max_retries: 5 # Retries after a 429
  rate_limit_backoff_seconds: 30 # Initial wait after a 429 without Retry-After
  rate_limit_max_interval_seconds: 300 # Max wait / future minimum interval after 429s
  teaser_char_limit: 150 # Max characters per teaser
  teaser_batch_size: 10 # Papers per teaser LLM request
  max_concurrency: 4 # Teaser requests in flight at once (requests_per_minute still spaces their starts); 1 = one at a time
  system_prompt: null # Override the teaser system prompt

embedding:
  model: jinaai/jina-embeddings-v5-text-nano-retrieval # Hugging Face embedding model for ranking
  encode_kwargs: # SentenceTransformer.encode kwargs
    task: retrieval
    prompt_name: document

executor:
  categories: ["cs.AI", "cs.CV", "cs.LG", "cs.CL"] # arXiv categories to follow
  include_cross_list: false # Include arXiv cross-list papers
  debug: ${DEBUG:false}
  send_empty: false # Send an email even when no new papers were found
  max_paper_num: 100 # Papers presented in the email
  lookback_days: 3 # Days back to retrieve, so a failed run is caught up next run
  state_file: state/recommended.json # Dedup history; null disables
  history_days: 30 # Days of dedup history to keep
  topic_threshold: 0.5 # Cosine similarity threshold for topic grouping
  embedding_cache_file: state/corpus_embeddings.npz # Corpus vector cache; null disables
  output_dir: output # Rendered email + run summary; null disables
