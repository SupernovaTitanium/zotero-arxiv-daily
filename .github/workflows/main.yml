name: Send emails daily
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

# Never let a manual dispatch race the scheduled run: both write the same
# state/cache files.
concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore recommendation state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/recommended.json
            state/corpus_embeddings.npz
            ~/.cache/huggingface
          key: recommended-${{ github.run_id }}
          restore-keys: recommended-

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SMTP_SERVER: ${{ vars.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run python scripts/apply_config_env_overrides.py config/custom.yaml
          echo "Use custom config: "
          # Mask values of key/password/secret-like entries in case someone
          # pasted real credentials into CUSTOM_CONFIG.
          sed -E 's/^([[:space:]]*[^#]*?(key|password|secret|token)[^:]*):.*/\1: ***MASKED***/I' config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Save recommendation state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/recommended.json
            state/corpus_embeddings.npz
            ~/.cache/huggingface
          key: recommended-${{ github.run_id }}

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-outputs-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
