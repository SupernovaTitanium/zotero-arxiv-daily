name: Send emails daily
on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Override executor.lookback_days (e.g. 14 to backfill missed days). Empty = config value.'
        required: false
        default: ''
        type: string
      resend_run_id:
        description: 'Workflow run ID whose email_*.html should be re-sent as-is (no pipeline, no state change).'
        required: false
        default: ''
        type: string
      fresh_state:
        description: '"true" = delete the restored state/recommended.json before running, so dedup history starts empty. Use when a backfill already recorded the whole pool as seen.'
        required: false
        default: 'false'
        type: string
      max_paper_num:
        description: 'Override executor.max_paper_num (e.g. 100 for a special edition). Empty = config value.'
        required: false
        default: ''
        type: string
      retry_count:
        description: 'Internal: how many automatic retries already ran for this logical run. Set automatically by retry-dispatch; do not set by hand.'
        required: false
        default: ''
        type: string
  schedule:
    # 21:43 UTC ≈ 05:43 next morning in Taiwan. Deliberately BEFORE the daily
    # announcement (20:00 ET = 00:00 UTC): submissions for that announcement are
    # already queryable by ~19:00 UTC, and GitHub's scheduler delay used to push
    # the 22:00 cron into 00:00 UTC, where the global stampede of arxiv-daily
    # jobs gets shared runner IPs rate-limited (HTTP 429) by arXiv for hours.
    - cron: '43 21 * * *'

permissions:
  contents: read
  actions: read

# Never let a manual dispatch race the scheduled run: both write the same
# state/cache files.
concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Restore recommendation state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/recommended.json
            state/corpus_embeddings.npz
            ~/.cache/huggingface
          key: recommended-${{ github.run_id }}
          restore-keys: recommended-

      - name: Run script
        if: inputs.resend_run_id == ''
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SMTP_SERVER: ${{ vars.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          FRESH_STATE: ${{ inputs.fresh_state }}
          MAX_PAPER_NUM: ${{ inputs.max_paper_num }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          if [ -n "$LOOKBACK_DAYS" ]; then
            sed -i "s/^\([[:space:]]*lookback_days:\).*/\1 $LOOKBACK_DAYS/" config/custom.yaml
            echo "Backfill run: lookback_days overridden to $LOOKBACK_DAYS"
          fi
          if [ -n "$MAX_PAPER_NUM" ]; then
            sed -i "s/^\([[:space:]]*max_paper_num:\).*/\1 $MAX_PAPER_NUM/" config/custom.yaml
            echo "Override: max_paper_num set to $MAX_PAPER_NUM"
          fi
          if [ "$FRESH_STATE" = "true" ]; then
            rm -f state/recommended.json
            echo "Fresh-state run: removed restored state/recommended.json; dedup history starts empty"
          fi
          uv run python scripts/apply_config_env_overrides.py config/custom.yaml
          echo "Use custom config: "
          # Mask values of key/password/secret-like entries in case someone
          # pasted real credentials into CUSTOM_CONFIG.
          sed -E 's/^([[:space:]]*[^#]*?(key|password|secret|token)[^:]*):.*/\1: ***MASKED***/I' config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Resend email from a previous run
        if: inputs.resend_run_id != ''
        env:
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          EMAIL_SMTP_SERVER: ${{ vars.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ vars.EMAIL_SMTP_PORT }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
          RESEND_RUN_ID: ${{ inputs.resend_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          uv run python scripts/apply_config_env_overrides.py config/custom.yaml
          uv run python scripts/resend_email.py --run-id "$RESEND_RUN_ID"

      - name: Save recommendation state
        if: always() && inputs.resend_run_id == ''
        uses: actions/cache/save@v4
        with:
          path: |
            state/recommended.json
            state/corpus_embeddings.npz
            ~/.cache/huggingface
          key: recommended-${{ github.run_id }}

      - name: Upload run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-outputs-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore

  # arXiv 429s shared GitHub runner IPs hard around the 00:00 UTC announcement
  # window; if the daily run fails on that, waiting out the storm and starting a
  # fresh run is more reliable than longer sleeps inside one job. Dispatches
  # carry the original inputs plus an incremented retry_count; the guard below
  # caps the loop at two retries. GITHUB_TOKEN-triggered workflow_dispatch does
  # start a new run (documented exception to the recursion guard).
  retry-dispatch:
    needs: calculate-and-send
    if: failure() && fromJSON(inputs.retry_count || '0') < 2
    permissions:
      actions: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: ${{ github.ref_name }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days }}
      RESEND_RUN_ID: ${{ inputs.resend_run_id }}
      FRESH_STATE: ${{ inputs.fresh_state }}
      MAX_PAPER_NUM: ${{ inputs.max_paper_num }}
      RETRY_COUNT: ${{ inputs.retry_count }}
    steps:
      - name: Wait out the rate-limit window, then dispatch a fresh run
        run: |
          NEXT=$(( ${RETRY_COUNT:-0} + 1 ))
          echo "Run failed (retry_count=${RETRY_COUNT:-0}). Most common cause: arXiv API HTTP 429."
          echo "Waiting 2h before dispatching a fresh run with retry_count=$NEXT..."
          sleep 7200
          jq -n --arg ref "$REF" --arg lb "$LOOKBACK_DAYS" --arg rs "$RESEND_RUN_ID" \
                --arg fs "$FRESH_STATE" --arg mp "$MAX_PAPER_NUM" --arg rc "$NEXT" \
            '{ref: $ref, inputs: {lookback_days: $lb, resend_run_id: $rs, fresh_state: $fs, max_paper_num: $mp, retry_count: $rc}}' > payload.json
          curl -sf -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/workflows/main.yml/dispatches" \
            -d @payload.json
          echo "Dispatched fresh run with retry_count=$NEXT"
